{% extends "base.html" %}
{% block content %}
<div class="header">
    <h1>Edit Income</h1>
    <p>Update your income details</p>
</div>

<div class="card">
    <form action="/edit-income/{{ income._id }}" method="POST" class="expense-form">
        <input type="number" step="0.01" min="0" name="amount" value="{{ income.amount }}" placeholder="Income Amount (INR)" required>
        <input type="text" name="source" value="{{ income.source }}" placeholder="Source (Salary, Freelance, etc.)">
        <input type="date" name="date" value="{{ income.date }}" required>
        <div></div>
        <button type="submit">Update Income</button>
    </form>
</div>
{% endblock %}
